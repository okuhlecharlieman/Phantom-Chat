<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Phantom Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div class="container">
 
  <header>
    <h1 class="flicker">👻 Phantom Chat 👻</h1>
    <p class="subtitle">Dare to speak with the dead? <span class="ghost-emoji">💀</span></p>
    <div class="floating-candles">
      <span class="candle">🕯️</span>
      <span class="candle">🕯️</span>
      <span class="candle">🕯️</span>
    </div>
  </header>

  <main id="main-content" role="main">
  <div id="chat-window" aria-live="polite" aria-label="Chat messages">
    <div id="messages"></div>
    <div id="chat-actions" aria-label="Chat actions">
      <button class="emoji-btn" onclick="addEmoji('😂')" aria-label="Add laughing emoji">😂</button>
      <button class="emoji-btn" onclick="addEmoji('😱')" aria-label="Add scared emoji">😱</button>
      <button class="emoji-btn" onclick="addEmoji('👻')" aria-label="Add ghost emoji">👻</button>
      <button class="emoji-btn" onclick="addEmoji('🎃')" aria-label="Add pumpkin emoji">🎃</button>
      <button class="like-btn" onclick="likeMessage()" aria-label="Like last message">👍 Like</button>
      <button class="comment-btn" onclick="commentMessage()" aria-label="Comment on last message">💬 Comment</button>
    </div>
  </div>
  <input type="text" id="user-input" placeholder="Whisper to the spirits..." aria-label="Type your message to the phantom" autocomplete="off">
  <button id="send-btn" aria-label="Send your message to the phantom">Summon Reply 🔮</button>
  </main>
  <audio id="ghost-sound" src="{{ url_for('static', filename='ghost.mp3') }}" aria-hidden="true"></audio>
  <audio id="bg-music" src="{{ url_for('static', filename='spooky-bg.mp3') }}" loop aria-hidden="true"></audio>

  <!-- Animated fog background -->
  <div id="fog-bg"></div>
  <!-- Floating ghost animation -->
  <div id="floating-ghost" aria-hidden="true">👻</div>
  <!-- Random ghost popup (jump scare) -->
  <div id="ghost-popup" class="popup" style="display:none;" role="dialog" aria-labelledby="popup-title" aria-describedby="popup-desc">
    <span class="close" onclick="document.getElementById('ghost-popup').style.display='none'" aria-label="Close popup">×</span>
    <h2 id="popup-title" class="flicker">BOO! 👻</h2>
    <p id="popup-desc">The ghost is watching you...</p>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const ghostSound = document.getElementById("ghost-sound");
    const bgMusic = document.getElementById("bg-music");
    const floatingGhost = document.getElementById("floating-ghost");
    const fogBg = document.getElementById("fog-bg");
    const ghostPopup = document.getElementById("ghost-popup");

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = sender === "user" ? "user-msg" : "ghost-msg flicker";
      msg.innerText = text;
      // Add ARIA attributes for accessibility
      if(sender === "user") {
        msg.setAttribute("role", "status");
        msg.setAttribute("aria-live", "polite");
      } else {
        msg.setAttribute("role", "alert");
        msg.setAttribute("aria-live", "assertive");
      }
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
      if(sender === "ghost") ghostSound.play();
      if(sender === "ghost") spawnFloatingEmoji('👻');
    }

    function showTypingAnimation() {
      const typing = document.createElement('div');
      typing.className = 'ghost-typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      typing.setAttribute('aria-label', 'Phantom is typing...');
      typing.setAttribute('role', 'status');
      typing.setAttribute('aria-live', 'polite');
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;
      return typing;
    }

    async function sendMessage() {
      const userMessage = input.value.trim();
      if(!userMessage) return;
      appendMessage("user", userMessage);
      input.value = "";
      
      // Show typing animation
      const typingAnimation = showTypingAnimation();
      
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage })
        });
        const data = await response.json();
        
        // Remove typing animation
        setTimeout(() => {
          typingAnimation.remove();
          appendMessage("ghost", data.reply);
        }, 1000 + Math.random() * 2000);
      } catch (error) {
        typingAnimation.remove();
        appendMessage("ghost", "👻 *ethereal static* Something's interfering with the connection...");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => { if(e.key === "Enter") sendMessage(); });

    // Emoji, Like, Comment functions
    function addEmoji(emoji) {
      input.value += emoji;
      input.focus();
      spawnFloatingEmoji(emoji);
    }
    function likeMessage() {
      if(messages.lastChild) {
        messages.lastChild.innerHTML += ' <span class="liked">👍</span>';
        spawnFloatingEmoji('👍');
      }
    }
    function commentMessage() {
      const comment = prompt("Add your comment:");
      if(comment && messages.lastChild) {
        messages.lastChild.innerHTML += `<div class='comment'>💬 ${comment}</div>`;
        spawnFloatingEmoji('💬');
      }
    }

    // Floating emoji animation
    function spawnFloatingEmoji(emoji) {
      const e = document.createElement('div');
      e.className = 'floating-emoji';
      e.innerText = emoji;
      e.style.left = (Math.random() * 80 + 10) + 'vw';
      e.setAttribute('aria-hidden', 'true');
      document.body.appendChild(e);
      setTimeout(() => { e.remove(); }, 2000);
    }

    // Floating ghost animation
    function animateGhost() {
      let pos = 0, dir = 1;
      setInterval(() => {
        pos += dir * 2;
        if(pos > 80) dir = -1;
        if(pos < 0) dir = 1;
        floatingGhost.style.left = pos + 'vw';
        floatingGhost.style.top = (10 + Math.sin(pos/10)*5) + 'vh';
      }, 80);
    }

    // Fog effect
    function animateFog() {
      fogBg.innerHTML = '';
      for(let i=0; i<10; i++) {
        const fog = document.createElement('div');
        fog.className = 'fog';
        fog.style.left = (i*10 + Math.random()*5) + 'vw';
        fog.style.top = (Math.random()*60) + 'vh';
        fog.style.animationDuration = (10 + Math.random()*10) + 's';
        fogBg.appendChild(fog);
      }
    }

    // Random ghost popup (jump scare)
    function randomGhostPopup() {
      setTimeout(() => {
        ghostPopup.style.display = 'block';
        ghostSound.play();
        setTimeout(() => { ghostPopup.style.display = 'none'; }, 2000);
        randomGhostPopup();
      }, 15000 + Math.random()*15000);
    }

    // Start effects on load
    window.onload = function() {
      bgMusic.volume = 0.3;
      bgMusic.play().catch(function(error) {
        console.log("Audio play failed:", error);
      });
      animateGhost();
      animateFog();
      randomGhostPopup();
    };
  </script>
  </div>
</body>
</html>
